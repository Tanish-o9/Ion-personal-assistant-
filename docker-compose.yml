version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ion-postgres
    restart: always
    environment:
      POSTGRES_USER: ion_user
      POSTGRES_PASSWORD: secure_password
      POSTGRES_DB: ion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ion_user -d ion_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ion-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ion-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://ion_user:secure_password@postgres:5432/ion_db
      - REDIS_URL=redis://redis:6379/0
      - ION_ENV=production
      - ION_WAKE_PHRASE=Hey Ion
      - DEBUG=false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
