name: ION CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ion_user
          POSTGRES_PASSWORD: secure_password
          POSTGRES_DB: ion_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Core Test Suite
        env:
          DATABASE_URL: postgresql://ion_user:secure_password@localhost:5432/ion_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: ci_secret_key
          ION_ENV: test
          ION_WAKE_PHRASE: "Hey Ion"
        run: |
          python -m pytest tests/test_voice.py tests/test_ion_100_scenarios.py tests/test_ion_5_master_e2e.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
