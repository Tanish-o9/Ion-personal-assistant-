name: ION CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite
        env:
          DATABASE_URL: "sqlite:///./test_ion.db"
          SECRET_KEY: "ci_secret_key"
          ION_ENV: "test"
          ION_WAKE_PHRASE: "Hey Ion"
        run: |
          python -m pytest tests/test_voice.py tests/test_ion_100_scenarios.py tests/test_ion_5_master_e2e.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Frontend
        run: |
          cd frontend
          npm install
          npm run build
